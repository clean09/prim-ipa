# Unsignierte iPhone-App (.ipa) zum Sideloaden – baut auf einem macOS-Rechner von GitHub, kein Mac und kein
# Apple-Entwicklerkonto nötig. Signiert wird erst beim Installieren (Sideloadly/AltStore mit deiner Apple-ID).
# Anleitung: IPHONE_SIDELOAD.md
#
# Optional (für die weltweite Bestenliste) unter Settings → Secrets and variables → Actions:
#   VITE_LB_URL   https://primsieb-leaderboard.primsieb-leaderboard.workers.dev
#   VITE_LB_KEY   gleicher Wert wie in der lokalen .env
name: iPhone-IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'server/**', 'android/**']

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Web-App bauen
        env:
          VITE_LB_URL: ${{ secrets.VITE_LB_URL }}
          VITE_LB_KEY: ${{ secrets.VITE_LB_KEY }}
        run: |
          npm ci
          printf 'VITE_LB_URL=%s\nVITE_LB_KEY=%s\n' "$VITE_LB_URL" "$VITE_LB_KEY" > .env
          npm run build
          npx cap sync ios

      - name: Xcode wählen
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true

      - name: CocoaPods
        working-directory: ios/App
        run: pod install

      - name: App bauen (Gerät, ohne Signatur)
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} build

      - name: IPA packen
        run: |
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/App.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          VER=$(node -p "require('./package.json').version")
          cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/PrimSieb-$VER.ipa" Payload
          ls -la "$GITHUB_WORKSPACE"/*.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: PrimSieb-iPhone-ipa
          path: '*.ipa'
          retention-days: 30
